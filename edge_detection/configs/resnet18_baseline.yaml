experiment_name: "resnet18_baseline"

# Data paths & parameters
data:
  train_csv: "data/edges_train/edges_train.csv"
  train_dir: "data/edges_train"
  val_csv: "data/edges_validation/edges_validation.csv"
  val_dir: "data/edges_validation"
  test_csv: "data/edges_test/edges_test.csv"
  test_dir: "data/edges_test"
  img_size: [224, 224]

# Model settings
model:
  architecture: "resnet18"         # Options: 'custom_cnn', 'resnet18', 'resnet34', 'mobilenet_v3'
  pretrained: true
  num_classes: 8                   # 4 corners * 2 coordinates (x, y)

# Optimization settings
hyperparameters:
  epochs: 16
  batch_size: 16
  learning_rate: 0.001
  optimizer: "adam"                # 'adam', 'sgd', 'adamw'
  weight_decay: 1e-4
  scheduler: "cosine"              # 'none', 'cosine', 'step'
  loss_fn: "mse"                   # 'mse' (Mean Squared Error) or 'l1' (L1 / Smooth L1)
